[package]
name = "os"
version = "0.0.1"
edition = "2024"

[dependencies]
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
shlex = "2"
thiserror = "2"
tokio = { version = "1.53.1", features = ["sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
