[package]
name = "ollama-benchmark"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "ollama-benchmark"
path = "src/main.rs"

[dependencies]
ollama = { path = ".." }
llm = { path = "../../../llm" }
os = { path = "../../../os" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
