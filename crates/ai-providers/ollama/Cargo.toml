[package]
name = "ollama"
version = "0.0.1"
edition = "2024"

[dependencies]
llm = { path = "../../llm" }
base64 = "0.22"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
url = "2"
