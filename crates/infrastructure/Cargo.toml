[package]
name = "infrastructure"
version = "0.0.1"
edition = "2024"

[dependencies]
filesystem = { path = "../filesystem" }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "uuid", "time", "json"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "rt", "sync"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
