[workspace]
members = [
    "apps/*/src-tauri",
    "apps/tui",
    "crates/filesystem",
    "crates/os",
    "crates/infrastructure",
    "crates/llm",
    "crates/ai-providers",
    "crates/ai-providers/chatgpt",
    "crates/ai-providers/claude",
    "crates/ai-providers/gemini",
    "crates/ai-providers/llama-cpp",
    "crates/ai-providers/lm-studio",
    "crates/ai-providers/ollama",
    "crates/ai-providers/ollama/benchmark",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
base64 = "0.22.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
encoding_rs = "0.8.35"
futures-util = "0.3.31"
html-escape = "0.2.15"
jsonschema = { version = "0.57.0", default-features = false }
lol_html = "3.0.1"
mime_guess = "2.0.5"
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "user"] }
windows-permissions = "=0.2.4"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "1.1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subc-jobobject = "=0.1.1"
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }
tokio = "1.53.1"
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
rappct = "0.13.3"
win-file-id = "0.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
