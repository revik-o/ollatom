[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
macos-direct = []
wayland-blur = ["dep:window-vibrancy-wayland"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
infrastructure = { path = "../../../crates/infrastructure" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
window-vibrancy-wayland = { package = "window-vibrancy", git = "https://github.com/tauri-apps/window-vibrancy", rev = "0d2bf22b77318690b54a27fa0505437718fd69f6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
